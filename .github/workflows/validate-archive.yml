name: Validate plugin archive

on:
  pull_request:
  push:
    branches: [main, "audit/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate archive structure
        run: python scripts/validate_archive.py
