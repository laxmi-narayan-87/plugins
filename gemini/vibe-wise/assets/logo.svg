<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="32" y1="32" x2="224" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="64" y1="64" x2="192" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366F1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer container with rounded corners and subtle stroke -->
  <rect x="20" y="20" width="216" height="216" rx="44" fill="#0F172A" stroke="url(#primaryGrad)" stroke-width="4" filter="url(#glow)"/>

  <!-- Open Book Base (Foundation of Learning) -->
  <path d="M64 184 C88 174 116 174 128 184 C140 174 168 174 192 184 L192 144 C168 134 140 134 128 144 C116 134 88 134 64 144 Z" fill="url(#primaryGrad)" opacity="0.3" stroke="url(#primaryGrad)" stroke-width="3" stroke-linejoin="round"/>
  <path d="M128 144 L128 184" stroke="url(#primaryGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Left Code Bracket < -->
  <path d="M96 82 L64 114 L96 146" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right Code Bracket > -->
  <path d="M160 82 L192 114 L160 146" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Central Lightbulb / Wisdom Spark -->
  <path d="M128 66 C116 66 108 74 108 85 C108 93 113 99 117 104 C120 108 122 112 122 116 L134 116 C134 112 136 108 139 104 C143 99 148 93 148 85 C148 74 140 66 128 66 Z" fill="url(#primaryGrad)"/>
  <rect x="123" y="120" width="10" height="3" rx="1.5" fill="#F8FAFC"/>
  
  <!-- Rays of Wisdom -->
  <circle cx="128" cy="46" r="3" fill="#FBBF24"/>
  <circle cx="106" cy="52" r="2.5" fill="#FBBF24"/>
  <circle cx="150" cy="52" r="2.5" fill="#FBBF24"/>
</svg>
